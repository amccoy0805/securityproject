{% extends "base.html" %}
{% block title %}Sign in · Aegis{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-slate-800 bg-slate-900/60 p-8">
  <h1 class="text-2xl font-semibold">Sign in</h1>
  <p class="mt-1 text-sm text-slate-400">Use your tenant administrator credentials.</p>
  {% if error %}
  <div class="mt-4 rounded border border-red-700 bg-red-900/40 px-3 py-2 text-sm text-red-200">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="/login" class="mt-6 space-y-4">
    <label class="block text-sm">
      <span class="text-slate-300">Email</span>
      <input type="email" name="email" required autofocus
             class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2" />
    </label>
    <label class="block text-sm">
      <span class="text-slate-300">Password</span>
      <input type="password" name="password" required
             class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2" />
    </label>
    <button class="w-full rounded bg-emerald-500 py-2 font-medium text-slate-950 hover:bg-emerald-400">
      Sign in
    </button>
  </form>
</div>
{% endblock %}

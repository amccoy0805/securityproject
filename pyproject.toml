[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-gateway"
version = "0.1.0"
description = "Aegis AI Gateway — security, governance, and compliance layer for enterprise AI usage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aegis Security" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 is FastAPI's standard Depends() pattern; UP007 wants `X | Y` everywhere
# but pydantic + SQLAlchemy 2 still benefit from explicit Optional in places.
ignore = ["E501", "B008"]
